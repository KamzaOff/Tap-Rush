<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tap Rush</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
    }
    .stats span {
      margin-left: 12px;
      color: #38bdf8;
    }
    #arena {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 62vh;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      overflow: hidden;
      margin: 14px 0;
      touch-action: manipulation;
    }
    #target {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.45);
      cursor: pointer;
    }
    #target.bonus {
      background: #f59e0b;
      color: #451a03;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    #startBtn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 14px 26px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    footer {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div>TAP RUSH</div>
    <div class="stats">
      Score: <span id="score">0</span>
      Temps: <span id="time">20s</span>
    </div>
  </header>

  <div id="arena">
    <button id="target" type="button">TAP</button>
    <div id="overlay">
      <h2 id="title" style="margin:0;">Prêt à taper ?</h2>
      <p id="desc" style="margin:0;color:#cbd5e1;">Touche les cercles verts (+1) et dorés (+3) avant la fin du chrono.</p>
      <button id="startBtn" type="button">Jouer</button>
    </div>
  </div>

  <footer>Meilleur score : <strong id="best">0</strong></footer>

  <script>
    const arena = document.getElementById("arena");
    const target = document.getElementById("target");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("desc");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const bestEl = document.getElementById("best");

    let score = 0;
    let timeLeft = 20;
    let gameTimer = null;
    let moveTimer = null;
    let isBonus = false;

    const bestScore = Number(localStorage.getItem("tapRushBest") || 0);
    bestEl.textContent = bestScore;

    function placeTarget() {
      const size = 72;
      const maxX = Math.max(0, arena.clientWidth - size);
      const maxY = Math.max(0, arena.clientHeight - size);
      const x = Math.floor(Math.random() * (maxX + 1));
      const y = Math.floor(Math.random() * (maxY + 1));

      isBonus = Math.random() < 0.25;
      target.classList.toggle("bonus", isBonus);
      target.textContent = isBonus ? "+3" : "TAP";
      target.style.left = x + "px";
      target.style.top = y + "px";
      target.style.display = "flex";

      clearTimeout(moveTimer);
      moveTimer = setTimeout(placeTarget, 1100);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearTimeout(moveTimer);
      target.style.display = "none";

      const currentBest = Number(localStorage.getItem("tapRushBest") || 0);
      if (score > currentBest) {
        localStorage.setItem("tapRushBest", String(score));
        bestEl.textContent = score;
        titleEl.textContent = "Nouveau record !";
      } else {
        titleEl.textContent = "Temps écoulé !";
      }

      descEl.textContent = "Score final : " + score + " points.";
      startBtn.textContent = "Rejouer";
      overlay.style.display = "flex";
    }

    function startGame() {
      score = 0;
      timeLeft = 20;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft + "s";
      overlay.style.display = "none";
      placeTarget();

      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft + "s";
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    target.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      score += isBonus ? 3 : 1;
      scoreEl.textContent = score;
      placeTarget();
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
